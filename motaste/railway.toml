# Railway configuration for Laravel application
# Railway will use the Dockerfile for building and deploying

[build]
# Use the Dockerfile in the project root
builder = "dockerfile"

[start]
# The Dockerfile CMD handles starting the app
# But we also set up the port for Railway
private_network = { port = 8000 }

[deploy]
# Run migrations on every deploy (safe - runs even if already up to date)
command = "php artisan migrate --force"

[[deploy]]
command = "php artisan config:cache"

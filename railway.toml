# Railway configuration for Laravel application
# The Laravel app lives in the 'motaste/' subdirectory.
# Set the Source Directory in Railway dashboard to 'motaste'
# so the Dockerfile and this config inside motaste/ are used.

[build]
# If Railway is configured with source_dir='motaste', this Dockerfile is used:
builder = "dockerfile"

[start]
private_network = { port = 8000 }

[deploy]
command = "php artisan migrate --force"

[[deploy]]
command = "php artisan config:cache"
